<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Zero Shop</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Barra de navegación simple superior -->
    <nav class="navbar navbar-light bg-white border-bottom py-2">
        <div class="container justify-content-between">
            <a class="navbar-brand" th:href="@{/}">
                <img src="/assets/logo-black.png" alt="Zero Shop" height="32" onerror="this.src='https://placehold.co/120x35/000/fff?text=ZERO+SHOP'">
            </a>
            <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver a la tienda
            </a>
        </div>
    </nav>

    <!-- Contenedor principal centrado -->
    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

                <!-- Tarjeta de Registro -->
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-sm-5">

                        <!-- Encabezado -->
                        <div class="text-center mb-4">
                            <h2 class="h4 fw-bold text-dark mb-1">Crear Cuenta</h2>
                            <p class="text-muted small">Únete a Zero Shop y disfruta de promociones exclusivas</p>
                        </div>

                        <!-- Formulario de Registro -->
                        <form th:action="@{/register}" method="post">
                            <!-- Token CSRF -->
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                            <!-- Nombres y Apellidos en dos columnas -->
                            <div class="row g-2 mb-3">
                                <div class="col-sm-6">
                                    <label for="firstName" class="form-label small fw-semibold">Nombre</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white text-muted"><i class="bi bi-person"></i></span>
                                        <input type="text" class="form-control" id="firstName" name="firstName" placeholder="Juan" required>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <label for="lastName" class="form-label small fw-semibold">Apellido</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white text-muted"><i class="bi bi-person"></i></span>
                                        <input type="text" class="form-control" id="lastName" name="lastName" placeholder="Pérez" required>
                                    </div>
                                </div>
                            </div>

                            <!-- Correo Electrónico -->
                            <div class="mb-3">
                                <label for="email" class="form-label small fw-semibold">Correo Electrónico</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white text-muted"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" name="email" placeholder="tu@email.com" required>
                                </div>
                            </div>

                            <!-- Contraseña -->
                            <div class="mb-3">
                                <label for="password" class="form-label small fw-semibold">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white text-muted"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="Mínimo 8 caracteres" required minlength="6">
                                </div>
                            </div>

                            <!-- Confirmar Contraseña -->
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label small fw-semibold">Confirmar Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white text-muted"><i class="bi bi-shield-lock"></i></span>
                                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Repite tu contraseña" required minlength="6">
                                </div>
                            </div>

                            <!-- Checkbox Términos -->
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="termsCheck" required>
                                <label class="form-check-label small text-muted" for="termsCheck">
                                    Acepto los <a th:href="@{/contact}" class="text-decoration-none">términos y condiciones</a> y la política de privacidad.
                                </label>
                            </div>

                            <!-- Botón de Envío -->
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary fw-semibold py-2">
                                    <i class="bi bi-person-plus me-1"></i>Crear Cuenta
                                </button>
                            </div>
                        </form>

                        <!-- Enlace a Login -->
                        <div class="text-center mt-4 pt-3 border-top">
                            <p class="text-muted small mb-0">
                                ¿Ya tienes una cuenta? 
                                <a th:href="@{/login}" class="text-primary fw-semibold text-decoration-none">Inicia sesión</a>
                            </p>
                        </div>

                    </div>
                </div>

                <!-- Pie inferior informativo -->
                <div class="text-center text-muted small mt-4">
                    &copy; 2026 Zero Shop. Todos los derechos reservados.
                </div>

            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
