<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

        <div class="footer-left">
            <div class="footer-logo">
                <img class="footer-logo-image" src="/assets/logo-white.png" alt="Zero Deportes">
                <h2>Zero Deportes</h2>
            </div>
            <p>&copy; 2026 Zero Shop. Todos los derechos reservados.</p>
            <p>Este proyecto es de caracter universitario, los productos mostrados en la tienda son de caracter ficticio.</p>
        </div>
        <div class="footer-right">
            <div class="footer-sitemap">
                <h3 class="footer-sitemap-title">Mapa del sitio</h3>
                <ul class="footer-sitemap-list">
                    <li class="footer-sitemap-list-item"><a th:href="@{/}">Inicio</a></li>
                    <li class="footer-sitemap-list-item"><a th:href="@{/products}">Productos</a></li>
                </ul>
