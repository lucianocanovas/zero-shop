<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/styles.css">
    <title>Usuarios</title>
    <script src="https://kit.fontawesome.com/1f6f2e3d37.js" crossorigin="anonymous"></script>
</head>
<body>
    <nav th:replace="common/fragments :: navOverlay"></nav>
    <div th:replace="common/fragments :: authOverlay"></div>
    <div th:replace="common/fragments :: accountOverlay"></div>
    <header th:replace="common/fragments :: header"></header>

    <main class="admin-users-page">
        <section class="admin-users-panel">
            <div class="admin-users-heading">
                <div>
                    <p class="admin-eyebrow">Administración</p>
                    <h1>Usuarios registrados</h1>
                </div>
                <span class="admin-users-count" th:text="${#lists.size(users)} + ' usuarios'">0 usuarios</span>
            </div>

            <div class="admin-message success" th:if="${success}" th:text="${success}"></div>
            <div class="admin-message error" th:if="${error}" th:text="${error}"></div>

            <div class="users-table-wrapper">
                <table class="users-table">
                    <thead>
                    <tr>
                        <th>Usuario</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th>Registrado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td data-label="Usuario">
                            <strong th:text="${user.persona != null ? user.persona.nombre + ' ' + user.persona.apellido : user.email}">Nombre Apellido</strong>
                        </td>
                        <td data-label="Correo" th:text="${user.email}">correo@ejemplo.com</td>
                        <td data-label="Rol">
                            <span class="user-role" th:classappend="${user.role.name() == 'ADMIN'} ? ' admin' : ''"
                                  th:text="${user.role.name() == 'ADMIN'} ? 'Administrador' : 'Usuario'">Usuario</span>
                        </td>
                        <td data-label="Registrado" th:text="${#temporals.format(user.created_at, 'dd/MM/yyyy')}">01/01/2026</td>
                        <td data-label="Acciones" class="user-actions">
                            <a class="user-action-edit" th:if="${user.role.name() == 'USER'}"
                               th:href="@{/users/{id}(id=${user.id})}">Editar</a>
                            <form th:if="${user.role.name() == 'USER'}"
                                  th:action="@{/users/{id}/delete(id=${user.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="user-action-delete" type="submit">Eliminar</button>
                            </form>
                            <span class="protected-user" th:if="${user.role.name() == 'ADMIN'}">Protegido</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td class="empty-users" colspan="5">No hay usuarios registrados.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer th:replace="common/fragments :: footer"></footer>
    <script src="/scripts/overlay.js"></script>
</body>
</html>
