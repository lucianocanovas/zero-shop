<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/styles.css">
    <title>Productos</title>
    <!-- FontAwesome Icons-->
    <script src="https://kit.fontawesome.com/1f6f2e3d37.js" crossorigin="anonymous"></script>
</head>
<body>

    <nav th:replace="common/fragments :: navOverlay"></nav>
    <div th:replace="common/fragments :: authOverlay"></div>
    <div th:replace="common/fragments :: accountOverlay"></div>
    <header th:replace="common/fragments :: header"></header>

    <!-- Main Content -->
    <main class="main">

        <h1 class="title">EXPLORA NUESTROS PRODUCTOS</h1>

        <section class="filters">
            <button class="filter-btn">Filtrar por precio</button>
            <button class="filter-btn">Filtrar por categoría</button>
        </section>

        <section class="search">
            <input type="text" placeholder="Buscar productos...">
        </section>

        <section class="products">
            
            <div class="product-card">
                <img src="/assets/product-placeholder.jpg" alt="Producto 1">
                <h3>Producto 1</h3>
                <p>Descripción del producto 1</p>
                <p class="product-price">$10.00</p>
                <button class="add-to-cart-btn">Añadir al carrito</button>
            </div>

            <div class="product-card">
                <img src="/assets/product-placeholder.jpg" alt="Producto 2">
                <h3>Producto 2</h3>
                <p>Descripción del producto 2</p>
                <p class="product-price">$15.00</p>
                <button class="add-to-cart-btn">Añadir al carrito</button>
            </div>

            <div class="product-card">
                <img src="/assets/product-placeholder.jpg" alt="Producto 3">
                <h3>Producto 3</h3>
                <p>Descripción del producto 3</p>
                <p class="product-price">$20.00</p>
                <button class="add-to-cart-btn">Añadir al carrito</button>
            </div>
        </section>

    </main>
    
    <footer class="footer" th:replace="common/fragments :: footer"></footer>

    <!-- JavaScript -->
    <script src="/scripts/overlay.js"></script>
    <script src="/scripts/carousel.js"></script>
</body>
</html>
