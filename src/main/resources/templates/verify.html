<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Cuenta - Zero Shop</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Barra de navegación simple superior -->
    <nav class="navbar navbar-light bg-white border-bottom py-2">
        <div class="container justify-content-between">
            <a class="navbar-brand" th:href="@{/}">
                <img src="/assets/logo-black.png" alt="Zero Shop" height="32" onerror="this.src='https://placehold.co/120x35/000/fff?text=ZERO+SHOP'">
            </a>
            <a th:href="@{/login}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-box-arrow-in-right me-1"></i>Ir a Iniciar Sesión
            </a>
        </div>
    </nav>

    <!-- Contenedor principal centrado -->
    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

                <!-- Tarjeta de Verificación -->
                <div class="card shadow-sm border-0 text-center">
                    <div class="card-body p-4 p-sm-5">

                        <!-- Icono y Título -->
                        <div class="mb-3 text-primary">
                            <i class="bi bi-envelope-check" style="font-size: 3.5rem;"></i>
                        </div>
                        <h2 class="h4 fw-bold text-dark mb-2">Verifica tu Correo</h2>
                        <p class="text-muted small mb-4">
                            Hemos enviado un correo de confirmación. Por favor ingresa el código de 6 dígitos para activar tu cuenta.
                        </p>

                        <!-- Formulario de Verificación de Código -->
                        <form th:action="@{/verify}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                            <div class="mb-4">
                                <label for="code" class="form-label small fw-semibold text-start d-block">Código de Verificación</label>
                                <!-- PLACEHOLDER BACKEND: Campo para el código o token de verificación -->
                                <input type="text" class="form-control form-control-lg text-center fw-bold letter-spacing-2" 
                                       id="code" name="code" placeholder="123456" maxlength="6" pattern="[0-9]{6}" required autofocus>
                                <div class="form-text small text-muted">Ingresa el código numérico de 6 dígitos.</div>
                            </div>

                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary fw-semibold py-2">
                                    <i class="bi bi-check2-circle me-1"></i>Confirmar y Activar
                                </button>
                            </div>
                        </form>

                        <!-- Reenvío de código -->
                        <div class="mt-4 pt-3 border-top text-center">
                            <p class="text-muted small mb-2">¿No recibiste el correo o venció el código?</p>
                            <form th:action="@{/verify/resend}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-link btn-sm text-decoration-none fw-semibold">
                                    <i class="bi bi-arrow-clockwise me-1"></i>Reenviar código de verificación
                                </button>
                            </form>
                        </div>

                    </div>
                </div>

                <!-- Pie inferior informativo -->
                <div class="text-center text-muted small mt-4">
                    &copy; 2026 Zero Shop. Todos los derechos reservados.
                </div>

            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
