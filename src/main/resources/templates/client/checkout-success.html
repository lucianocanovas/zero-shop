<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Compra Exitosa! - Zero Shop</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/styles/styles.css}" href="/styles/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Header Reutilizable -->
    <div th:replace="~{common/fragments/header :: header}"></div>

    <main class="container my-auto py-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 text-center">

                <div class="card border-0 shadow-sm p-4 p-md-5 bg-white">
                    <!-- Icono de Éxito -->
                    <div class="rounded-circle bg-success-subtle text-success mx-auto d-flex align-items-center justify-content-center mb-4" style="width: 80px; height: 80px;">
                        <i class="bi bi-check-lg display-4"></i>
                    </div>

                    <h1 class="h3 fw-bold text-dark mb-2">¡Gracias por tu compra!</h1>
                    <p class="text-muted small mb-4">
                        Tu pedido ha sido procesado exitosamente. Hemos enviado la confirmación y el comprobante detallado a tu correo electrónico.
                    </p>

                    <!-- Tarjeta con número de Orden -->
                    <div class="bg-light rounded-3 p-3 mb-4 text-start small">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Número de Pedido:</span>
                            <span class="fw-bold text-dark" th:text="${orderId != null ? orderId : '#ZR-89312'}">#ZR-89312</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Estado del Pago:</span>
                            <span class="badge bg-success-subtle text-success">Aprobado</span>
                        </div>
                        <div class="d-flex justify-content-between">
                            <span class="text-muted">Tiempo estimado de entrega:</span>
                            <span class="fw-semibold text-dark">2 a 3 días hábiles</span>
                        </div>
                    </div>

                    <!-- Botones de Acción -->
                    <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
                        <a th:href="@{/orders}" class="btn btn-outline-primary fw-semibold px-4 py-2">
                            <i class="bi bi-bag-check me-1"></i>Ver mis Compras
                        </a>
                        <a th:href="@{/}" class="btn btn-primary fw-semibold px-4 py-2">
                            <i class="bi bi-house-door me-1"></i>Volver a la Tienda
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer Reutilizable -->
    <div th:replace="~{common/fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
