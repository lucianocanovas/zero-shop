<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Zero Shop Mendoza</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/styles/styles.css}" href="/styles/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Header Reutilizable -->
    <div th:replace="~{common/fragments/header :: header}"></div>

    <main class="container my-4 flex-grow-1">
        <!-- Migas de pan -->
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb small">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Inicio</a></li>
                <li class="breadcrumb-item active" aria-current="page">Mi Perfil</li>
            </ol>
        </nav>

        <div class="row g-4 justify-content-center">
            <div class="col-12 col-lg-9">
                <div class="card border-0 shadow-sm p-4">
                    <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
                        <div class="rounded-circle bg-primary-subtle text-primary p-3 fs-2 d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
                            <i class="bi bi-person-fill"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold mb-0 text-dark">Información Personal del Cliente</h4>
                            <p class="text-muted small mb-0">Gestiona tus datos personales y dirección de entrega en Mendoza</p>
                        </div>
                    </div>

                    <form method="post" th:action="@{/profile}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="_method" value="PUT">

                        <!-- Sección 1: Datos Personales (Nombre, Apellido, Sexo, Fecha Nacimiento, Teléfono) -->
                        <h6 class="fw-bold text-primary mb-3">1. Datos Personales</h6>
                        <div class="row g-3 mb-4">
                            <div class="col-sm-6">
                                <label for="firstName" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="firstName" name="firstName" value="Juan" required>
                            </div>
                            <div class="col-sm-6">
                                <label for="lastName" class="form-label">Apellido</label>
                                <input type="text" class="form-control" id="lastName" name="lastName" value="Pérez" required>
                            </div>
                            <div class="col-sm-4">
                                <label for="gender" class="form-label">Sexo</label>
                                <select id="gender" name="gender" class="form-select" required>
                                    <option value="MALE" selected>Masculino</option>
                                    <option value="FEMALE">Femenino</option>
                                    <option value="OTHER">Otro</option>
                                </select>
                            </div>
                            <div class="col-sm-4">
                                <label for="dateOfBirth" class="form-label">Fecha de Nacimiento</label>
                                <input type="date" class="form-control" id="dateOfBirth" name="dateOfBirth" value="1995-05-14" required>
                            </div>
                            <div class="col-sm-4">
                                <label for="phone" class="form-label">Número de Teléfono</label>
                                <input type="tel" class="form-control" id="phone" name="phone" value="+54 9 261 455-1234" required>
                            </div>
                        </div>

                        <!-- Sección 2: Dirección Completa (Provincia, Departamento, Localidad, CP, Calle, N°, Manzana/Piso, Casa/Depto) -->
                        <h6 class="fw-bold text-primary mb-3">2. Dirección de Entrega en Mendoza</h6>
                        <div class="row g-3 mb-4">
                            <div class="col-sm-4">
                                <label for="state" class="form-label">Provincia</label>
                                <input type="text" class="form-control" id="state" name="state" value="Mendoza" required>
                            </div>
                            <div class="col-sm-4">
                                <label for="department" class="form-label">Departamento</label>
                                <input type="text" class="form-control" id="department" name="department" value="Capital" placeholder="Ej: Capital, Godoy Cruz, Guaymallén" required>
                            </div>
                            <div class="col-sm-4">
                                <label for="city" class="form-label">Localidad</label>
                                <input type="text" class="form-control" id="city" name="city" value="Mendoza" required>
                            </div>

                            <div class="col-sm-6">
                                <label for="street" class="form-label">Calle</label>
                                <input type="text" class="form-control" id="street" name="street" value="Av. San Martín" required>
                            </div>
                            <div class="col-sm-3">
                                <label for="number" class="form-label">N° de Calle</label>
                                <input type="text" class="form-control" id="number" name="number" value="1250" required>
                            </div>
                            <div class="col-sm-3">
                                <label for="zipCode" class="form-label">Código Postal</label>
                                <input type="text" class="form-control" id="zipCode" name="zipCode" value="M5500" required>
                            </div>

                            <div class="col-sm-6">
                                <label for="floor" class="form-label">Manzana / Piso <span class="text-muted small">(opc.)</span></label>
                                <input type="text" class="form-control" id="floor" name="floor" value="Piso 2">
                            </div>
                            <div class="col-sm-6">
                                <label for="apartment" class="form-label">N° Casa / Departamento <span class="text-muted small">(opc.)</span></label>
                                <input type="text" class="form-control" id="apartment" name="apartment" value="Depto B">
                            </div>
                        </div>

                        <!-- Sección 3: Cuenta y Seguridad -->
                        <h6 class="fw-bold text-primary mb-3">3. Cuenta y Clave</h6>
                        <div class="row g-3 mb-4">
                            <div class="col-sm-6">
                                <label for="email" class="form-label">Correo Personal (Usuario)</label>
                                <input type="email" class="form-control" id="email" name="email" value="juan.perez@email.com" required>
                            </div>
                            <div class="col-sm-6">
                                <label for="password" class="form-label">Nueva Contraseña <span class="text-muted small fw-normal">(opcional)</span></label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Dejar en blanco para no cambiarla">
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                            <a th:href="@{/orders}" class="btn btn-outline-secondary">
                                <i class="bi bi-bag-check me-1"></i>Mis Compras y Seguimiento
                            </a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check-lg me-1"></i>Actualizar Perfil
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Reutilizable -->
    <div th:replace="~{common/fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
