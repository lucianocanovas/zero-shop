<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Orden</title>
</head>
<body>
    <a href="/orders">Volver a mis órdenes</a>

    <h1>Detalle de la Orden</h1>

    <p><strong>ID Orden:</strong> <span th:text="${order?.id}">#0000</span></p>
    <p><strong>Fecha:</strong> <span th:text="${order?.orderDate}">01/01/2026</span></p>
    <p><strong>Estado:</strong> <span th:text="${order?.status}">PENDIENTE</span></p>

    <h2>Productos</h2>
    <table>
        <thead>
            <tr>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Precio Unitario</th>
                <th>Subtotal</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="detail : ${order?.details}">
                <td th:text="${detail.productName}">Producto</td>
                <td th:text="${detail.quantity}">1</td>
                <td th:text="${detail.unitPrice}">$0.00</td>
                <td th:text="${detail.subtotal}">$0.00</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="3">Total:</th>
                <td th:text="${order?.total}">$0.00</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
