<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Producto</title>
</head>
<body>
    <a href="/products">Volver al catálogo</a>

    <h1 th:text="${product?.name}">Nombre del Producto</h1>

    <div>
        <img th:if="${product?.images != null and !product.images.empty}" th:src="${product.images[0].url}" alt="Foto del producto">
    </div>

    <p><strong>Precio:</strong> <span th:text="${product?.currentPrice}">$0.00</span></p>
    <p><strong>Descripción:</strong> <span th:text="${product?.description}">Descripción detallada del producto.</span></p>
    <p><strong>Stock disponible:</strong> <span th:text="${product?.stock}">0</span> unidades</p>

    <form method="post" action="/cart/add">
        <input type="hidden" name="productId" th:value="${product?.id}">
        
        <label for="quantity">Cantidad:</label>
        <input type="number" id="quantity" name="quantity" value="1" min="1">

        <button type="submit">Agregar al carrito</button>
        <button type="button">Comprar ahora</button>
    </form>
</body>
</html>
