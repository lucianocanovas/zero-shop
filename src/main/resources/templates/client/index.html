<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/assets/logo-white.png">
    <link rel="stylesheet" href="/styles/styles.css">
    <title>Inicio</title>
    <!-- FontAwesome Icons-->
    <script src="https://kit.fontawesome.com/1f6f2e3d37.js" crossorigin="anonymous"></script>
</head>
<body>

    <nav th:replace="common/fragments :: navOverlay"></nav>
    <div th:replace="common/fragments :: authOverlay"></div>
    <div th:replace="common/fragments :: accountOverlay"></div>
    <header th:replace="common/fragments :: header"></header>

    <!-- Main Content -->
    <main class="main">
        
        <!-- Banner Section -->
        <section class="banner">
            <div class="banner-logo">
                <img class="banner-logo-image" src="/assets/logo-white.png">
            </div>
        </section>

        <!-- Separator -->
        <div class="separator">
            <h3 class="separator-title">Productos destacados</h3>
        </div>

        <!-- Carousel Section -->
        <section class="carousel">
            <button class="carousel-prev" type="button" aria-label="Producto anterior"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="carousel-container">
                <div class="carousel-track">
                    <div class="carousel-slide">
                        <img src="/assets/product-placeholder.jpg" alt="Producto 1">
                        <h3>Producto 1</h3>
                        <p>Descripción del producto 1</p>
                    </div>
                    <div class="carousel-slide">
                        <img src="/assets/product-placeholder.jpg" alt="Producto 2">
                        <h3>Producto 2</h3>
                        <p>Descripción del producto 2</p>
                    </div>
                    <div class="carousel-slide">
                        <img src="/assets/product-placeholder.jpg" alt="Producto 3">
                        <h3>Producto 3</h3>
                        <p>Descripción del producto 3</p>
                    </div>
                </div>
            </div>
            <button class="carousel-next" type="button" aria-label="Producto siguiente"><i class="fa-solid fa-chevron-right"></i></button>
        </section>

        <!-- Separator -->
        <div class="separator">
            <h3 class="separator-title">Explorar categorías</h3>
        </div>

        <!-- Categories Section -->
        <section class="categories">
            <div class="category-card">
                <img src="/assets/product-placeholder.jpg" alt="Categoría 1">
                <h3>Hombres</h3>
                <a href="/categories/1" class="category-link">Ver todos</a>
            </div>
            <div class="category-card">
                <img src="/assets/product-placeholder.jpg" alt="Categoría 2">
                <h3>Mujeres</h3>
                <a href="/categories/2" class="category-link">Ver todos</a>
            </div>
            <div class="category-card">
                <img src="/assets/product-placeholder.jpg" alt="Categoría 3">
                <h3>Infantil</h3>
                <a href="/categories/3" class="category-link">Ver todos</a>
            </div>
        </section>

    </main>

    <footer th:replace="common/fragments :: footer"></footer>
    
    <!-- JavaScript -->
    <script src="/scripts/overlay.js"></script>
    <script src="/scripts/carousel.js"></script>
</body>
</html>
