<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
</head>
<body>
    <h1>Catálogo de Productos</h1>

    <form method="get" action="/products">
        <label for="search">Buscar:</label>
        <input type="text" id="search" name="search" th:value="${search}">

        <label for="category">Categoría:</label>
        <select id="category" name="categoryId">
            <option value="">Todas</option>
            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Categoría</option>
        </select>

        <label for="minPrice">Precio mínimo:</label>
        <input type="number" id="minPrice" name="minPrice" step="0.01">

        <label for="maxPrice">Precio máximo:</label>
        <input type="number" id="maxPrice" name="maxPrice" step="0.01">

        <button type="submit">Filtrar</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Imagen</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="product : ${products}">
                <td>
                    <img th:if="${product.images != null and !product.images.empty}" th:src="${product.images[0].url}" alt="Imagen de producto">
                </td>
                <td th:text="${product.name}">Producto Ejemplo</td>
                <td th:text="${product.description}">Descripción breve</td>
                <td th:text="${product.currentPrice}">$0.00</td>
                <td>
                    <a th:href="@{/products/{id}(id=${product.id})}">Ver detalle</a>
                    <button type="button">Agregar al carrito</button>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
