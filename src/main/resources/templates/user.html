<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Zero Shop Mendoza</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/styles/styles.css}" href="/styles/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Header Fragment -->
    <div th:replace="~{common/fragments/header :: header}"></div>

    <main class="container my-4 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-9">

                <!-- Alertas de éxito o error -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
                    <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                    <span th:text="${success}">Perfil actualizado exitosamente.</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                    <span th:text="${error}">Ocurrió un error al actualizar los datos.</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Tarjeta de Perfil -->
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3 border-bottom d-flex align-items-center justify-content-between">
                        <h1 class="h5 fw-bold mb-0 text-dark">
                            <i class="bi bi-person-gear me-2 text-primary"></i>Datos de Mi Cuenta (Zero Mendoza)
                        </h1>
                        <span class="badge bg-primary-subtle text-primary fw-semibold" th:if="${isAdmin}">Administrador</span>
                    </div>
                    <div class="card-body p-4">
                        <form method="post" th:action="${formAction != null ? formAction : '/profile'}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                            <!-- 1. Datos Personales -->
                            <h6 class="fw-bold text-primary mb-3">1. Datos Personales</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-sm-6">
                                    <label for="firstName" class="form-label">Nombre</label>
                                    <input type="text" class="form-control" id="firstName" name="firstName" th:value="${profileUser?.person?.firstName != null ? profileUser.person.firstName : 'Juan'}" required>
                                </div>
                                <div class="col-sm-6">
                                    <label for="lastName" class="form-label">Apellido</label>
                                    <input type="text" class="form-control" id="lastName" name="lastName" th:value="${profileUser?.person?.lastName != null ? profileUser.person.lastName : 'Pérez'}" required>
                                </div>
                                <div class="col-sm-4">
                                    <label for="gender" class="form-label">Sexo</label>
                                    <select id="gender" name="gender" class="form-select">
                                        <option value="MALE" selected>Masculino</option>
                                        <option value="FEMALE">Femenino</option>
                                        <option value="OTHER">Otro</option>
                                    </select>
                                </div>
                                <div class="col-sm-4">
                                    <label for="dateOfBirth" class="form-label">Fecha de Nacimiento</label>
                                    <input type="date" class="form-control" id="dateOfBirth" name="dateOfBirth" value="1995-05-14">
                                </div>
                                <div class="col-sm-4">
                                    <label for="phone" class="form-label">Número de Teléfono</label>
                                    <input type="tel" class="form-control" id="phone" name="phone" value="+54 9 261 455-1234">
                                </div>
                            </div>

                            <!-- 2. Dirección en Mendoza -->
                            <h6 class="fw-bold text-primary mb-3">2. Dirección en Mendoza</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-sm-4">
                                    <label for="state" class="form-label">Provincia</label>
                                    <input type="text" class="form-control" id="state" name="state" value="Mendoza" required>
                                </div>
                                <div class="col-sm-4">
                                    <label for="department" class="form-label">Departamento</label>
                                    <input type="text" class="form-control" id="department" name="department" value="Capital" required>
                                </div>
                                <div class="col-sm-4">
                                    <label for="city" class="form-label">Localidad</label>
                                    <input type="text" class="form-control" id="city" name="city" value="Mendoza" required>
                                </div>

                                <div class="col-sm-6">
                                    <label for="street" class="form-label">Calle</label>
                                    <input type="text" class="form-control" id="street" name="street" value="Av. San Martín" required>
                                </div>
                                <div class="col-sm-3">
                                    <label for="number" class="form-label">N° Calle</label>
                                    <input type="text" class="form-control" id="number" name="number" value="1250" required>
                                </div>
                                <div class="col-sm-3">
                                    <label for="zipCode" class="form-label">Código Postal</label>
                                    <input type="text" class="form-control" id="zipCode" name="zipCode" value="M5500" required>
                                </div>

                                <div class="col-sm-6">
                                    <label for="floor" class="form-label">Manzana / Piso</label>
                                    <input type="text" class="form-control" id="floor" name="floor" value="Piso 2">
                                </div>
                                <div class="col-sm-6">
                                    <label for="apartment" class="form-label">N° Casa / Depto</label>
                                    <input type="text" class="form-control" id="apartment" name="apartment" value="Depto B">
                                </div>
                            </div>

                            <!-- 3. Cuenta -->
                            <h6 class="fw-bold text-primary mb-3">3. Cuenta y Clave</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-sm-6">
                                    <label for="username" class="form-label">Correo Personal (Usuario)</label>
                                    <input type="email" class="form-control" id="username" name="email" th:value="${profileUser?.username != null ? profileUser.username : 'juan.perez@email.com'}" required>
                                </div>
                                <div class="col-sm-6">
                                    <label for="password" class="form-label">Nueva Contraseña <span class="text-muted fw-normal small">(opcional)</span></label>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="Dejar en blanco para no cambiarla">
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                <a th:href="@{/}" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-check-lg me-1"></i>Guardar Cambios
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{common/fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
