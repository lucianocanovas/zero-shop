<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/styles/styles.css">
	<title th:text="${adminEdit} ? 'Editar usuario' : 'Mi perfil'">Mi perfil</title>
	<script src="https://kit.fontawesome.com/1f6f2e3d37.js" crossorigin="anonymous"></script>
</head>
<body>
	<nav th:replace="common/fragments :: navOverlay"></nav>
	<div th:replace="common/fragments :: authOverlay"></div>
	<div th:replace="common/fragments :: accountOverlay"></div>
	<header th:replace="common/fragments :: header"></header>

	<main class="profile-page">
		<section class="profile-panel">
			<a class="profile-back-link" th:if="${adminEdit}" th:href="@{/users}">
				<i class="fa-solid fa-arrow-left"></i> Volver a usuarios
			</a>
			<h1 th:text="${adminEdit} ? 'Editar usuario' : 'Mi perfil'">Mi perfil</h1>
			<p class="profile-subtitle" th:if="${adminEdit}">Solo puedes modificar perfiles que no sean administradores.</p>

			<form class="profile-form" th:action="${formAction}" method="post">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
				<label for="firstName">Nombre</label>
				<input id="firstName" name="firstName" type="text" th:value="${profileUser.persona != null ? profileUser.persona.nombre : profileUser.nombreUsuario}" required>

				<label for="lastName">Apellido</label>
				<input id="lastName" name="lastName" type="text" th:value="${profileUser.persona != null ? profileUser.persona.apellido : ''}" required>

				<label for="email">Correo electrónico</label>
				<input id="email" name="email" type="email" th:value="${profileUser.email}" required>

				<label for="password">Nueva contraseña</label>
				<input id="password" name="password" type="password" minlength="8" placeholder="Dejar vacía para conservarla">
				<p class="profile-help">La contraseña solo se cambia si completas este campo.</p>

				<button class="profile-submit" type="submit">Guardar cambios</button>
			</form>
		</section>
	</main>

	<footer th:replace="common/fragments :: footer"></footer>
	<script src="/scripts/overlay.js"></script>
</body>
</html>
