<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Perfil de Usuario</title>
</head>
<body>
    <h1>Perfil de Usuario</h1>

    <p th:if="${success}" th:text="${success}"></p>
    <p th:if="${error}" th:text="${error}"></p>

    <form method="post" th:action="${formAction != null ? formAction : '/profile'}">
        <label for="username">Usuario / Email:</label>
        <input type="text" id="username" name="email" th:value="${user?.username}">

        <label for="firstName">Nombre:</label>
        <input type="text" id="firstName" name="firstName" th:value="${user?.person?.firstName}">

        <label for="lastName">Apellido:</label>
        <input type="text" id="lastName" name="lastName" th:value="${user?.person?.lastName}">

        <label for="password">Contraseña (dejar en blanco para no cambiar):</label>
        <input type="password" id="password" name="password">

        <button type="submit">Actualizar Perfil</button>
    </form>
</body>
</html>
