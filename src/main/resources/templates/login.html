<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Zero Shop</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Barra de navegación simple superior -->
    <nav class="navbar navbar-light bg-white border-bottom py-2">
        <div class="container justify-content-between">
            <a class="navbar-brand" th:href="@{/}">
                <img src="/assets/logo-black.png" alt="Zero Shop" height="32" onerror="this.src='https://placehold.co/120x35/000/fff?text=ZERO+SHOP'">
            </a>
            <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver a la tienda
            </a>
        </div>
    </nav>

    <!-- Contenedor principal centrado -->
    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

                <!-- Tarjeta de Login -->
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-sm-5">
                        
                        <!-- Encabezado -->
                        <div class="text-center mb-4">
                            <h2 class="h4 fw-bold text-dark mb-1">Iniciar Sesión</h2>
                            <p class="text-muted small">Ingresa tus credenciales para acceder a tu cuenta</p>
                        </div>

                        <!-- Alertas de estado de Spring Security -->
                        <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center small py-2 px-3 mb-3" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                            <div>Correo o contraseña incorrectos.</div>
                        </div>
                        <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center small py-2 px-3 mb-3" role="alert">
                            <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                            <div>Sesión cerrada correctamente.</div>
                        </div>

                        <!-- Formulario de Inicio de Sesión -->
                        <form th:action="@{/login}" method="post">
                            <!-- Token CSRF -->
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                            <!-- Campo Email -->
                            <div class="mb-3">
                                <label for="username" class="form-label small fw-semibold">Correo Electrónico</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white text-muted"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="username" name="username" placeholder="tu@email.com" required autofocus>
                                </div>
                            </div>

                            <!-- Campo Contraseña -->
                            <div class="mb-3">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label for="password" class="form-label small fw-semibold mb-0">Contraseña</label>
                                    <!-- Link de recuperación (placeholder para funcionalidad futura) -->
                                    <a href="#" class="text-decoration-none small text-muted">¿Olvidaste tu contraseña?</a>
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text bg-white text-muted"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                                </div>
                            </div>

                            <!-- Recordar sesión -->
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe" name="remember-me">
                                <label class="form-check-label small text-muted" for="rememberMe">Recordar mis datos</label>
                            </div>

                            <!-- Botón de Envío -->
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary fw-semibold py-2">
                                    <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
                                </button>
                            </div>
                        </form>

                        <!-- Enlace de Registro -->
                        <div class="text-center mt-4 pt-3 border-top">
                            <p class="text-muted small mb-0">
                                ¿No tienes una cuenta? 
                                <a th:href="@{/register}" class="text-primary fw-semibold text-decoration-none">Regístrate aquí</a>
                            </p>
                        </div>

                    </div>
                </div>

                <!-- Pie inferior informativo -->
                <div class="text-center text-muted small mt-4">
                    &copy; 2026 Zero Shop. Todos los derechos reservados.
                </div>

            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
