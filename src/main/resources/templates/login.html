<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Zero Shop</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" th:href="@{/styles/styles.css}" href="/styles/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Barra de navegación simple superior -->
    <nav class="navbar navbar-light bg-white border-bottom py-2">
        <div class="container justify-content-between">
            <a class="navbar-brand" th:href="@{/}">
                <img th:src="@{/assets/logo-black.png}" src="/assets/logo-black.png" alt="Zero Shop" height="32" onerror="this.src='https://placehold.co/120x35/0f172a/ffffff?text=ZERO+SHOP'">
            </a>
            <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver a la tienda
            </a>
        </div>
    </nav>

    <!-- Contenedor principal centrado -->
    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

                <!-- Tarjeta de Inicio de Sesión -->
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-sm-5">

                        <!-- Encabezado -->
                        <div class="text-center mb-4">
                            <h2 class="h4 fw-bold text-dark mb-1">Iniciar Sesión</h2>
                            <p class="text-muted small">Ingresa tus credenciales para acceder a tu cuenta</p>
                        </div>

                        <!-- Alertas de error o éxito -->
                        <div th:if="${param.error}" class="alert alert-danger py-2 small d-flex align-items-center mb-3" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2 fs-6"></i>
                            <span>Usuario o contraseña incorrectos.</span>
                        </div>
                        <div th:if="${param.logout}" class="alert alert-success py-2 small d-flex align-items-center mb-3" role="alert">
                            <i class="bi bi-check-circle-fill me-2 fs-6"></i>
                            <span>Has cerrado sesión con éxito.</span>
                        </div>

                        <!-- Formulario de Login -->
                        <form th:action="@{/login}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                            <!-- Campo Usuario / Email -->
                            <div class="mb-3">
                                <label for="username" class="form-label small fw-semibold">Correo Electrónico</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white text-muted"><i class="bi bi-envelope"></i></span>
                                    <input type="text" class="form-control" id="username" name="username" placeholder="tu@email.com" required autofocus>
                                </div>
                            </div>

                            <!-- Campo Contraseña -->
                            <div class="mb-3">
                                <div class="d-flex justify-content-between align-items-center">
                                    <label for="password" class="form-label small fw-semibold mb-0">Contraseña</label>
                                </div>
                                <div class="input-group mt-1">
                                    <span class="input-group-text bg-white text-muted"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                                </div>
                            </div>

                            <!-- Recordarme y Botón de Envío -->
                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" name="remember-me" id="remember-me">
                                <label class="form-check-label small text-muted" for="remember-me">
                                    Recordar mi sesión
                                </label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                                <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
                            </button>
                        </form>

                        <hr class="my-4 border-light-subtle">

                        <!-- Enlace a Registro -->
                        <div class="text-center small">
                            <span class="text-muted">¿Aún no tienes cuenta? </span>
                            <a th:href="@{/register}" class="fw-semibold text-primary text-decoration-none">Regístrate aquí</a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer Simple -->
    <footer class="text-center py-3 text-muted small mt-auto border-top bg-white">
        © 2026 Zero Shop. Todos los derechos reservados.
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
