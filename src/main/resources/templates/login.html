<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="/styles/styles.css">
    <!-- FontAwesome Icons-->
    <script src="https://kit.fontawesome.com/1f6f2e3d37.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <a href="/" class="header-link"><i class="fa-solid fa-arrow-left"></i> Volver al sitio</a>
    </header>

    <!-- Main Form -->
    <main>
        <form class="auth-form" th:action="@{/login}" method="post">
                <h2 class="auth-form-title">Iniciar sesión</h2>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input class="auth-form-input" id="username" name="username" type="email" placeholder="E-Mail" required autofocus>
                <input class="auth-form-input" id="password" name="password" type="password" placeholder="Contraseña" required>
                <button class="auth-form-button" type="submit">Entrar</button>
                <p class="auth-form-message">¿No tienes cuenta? <a th:href="@{/register}">Registrate</a></p>
                <p class="auth-form-message">¿Olvidaste tu contraseña? <a th:href="@{/reset-password}">Restablecer</a></p>
                <div class="auth-form-logo">
                    <img class="auth-form-logo-image" src="/assets/logo-black.png">
                </div>
        </form>
    </main>
</body>
</html>
