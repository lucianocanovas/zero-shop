<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="/styles/styles.css">
</head>
<body>
    <main>
        <h1>Iniciar sesión</h1>
        <p th:if="${param.error}" class="error">Correo o contraseña incorrectos.</p>
        <p th:if="${param.logout}" class="message">Has cerrado sesión correctamente.</p>
        <p th:if="${success}" class="message" th:text="${success}"></p>
        <form class="login-form" th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label class="login-form-label" for="username">Correo electrónico</label>
            <input class="login-form-input" id="username" name="username" type="email" required autofocus>
            <label class="login-form-label" for="password">Contraseña</label>
            <input class="login-form-input" id="password" name="password" type="password" required>
            <button class="login-form-button" type="submit">Entrar</button>
        </form>
        <p>¿No tienes cuenta? <a th:href="@{/register}">Registrate</a></p>
    </main>
</body>
</html>
