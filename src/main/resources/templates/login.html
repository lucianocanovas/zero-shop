<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Zero</title>
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/1f6f2e3d37.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" th:href="@{/styles/login.css}">
</head>
<body>
    <nav class="navbar">
        <a th:href="@{/}" class="navbar-link">
            <i class="fa-solid fa-arrow-left"></i> Volver a la tienda
        </a>
    </nav>
    <main>
        <form class="login-form" th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <h1 class="login-form-title">Iniciar Sesión</h1>
            <label class="login-form-label" for="username">
                <i class="fa-solid fa-user"></i>
            </label>
            <input class="login-form-input" type="text" id="username" name="username" placeholder="Correo electrónico" required>
            <label class="login-form-label" for="password">
                <i class="fa-solid fa-lock"></i>
            </label>
            <input class="login-form-input" type="password" id="password" name="password" placeholder="Contraseña" required>
            <input class="login-form-input" type="checkbox" name="remember-me" id="remember-me">
            <label class="login-form-label" for="remember-me">Recordarme</label>
            <button class="login-form-button" type="submit">Iniciar Sesión</button>
            <p class="login-form-text">¿No tienes cuenta?</p>
            <a class="login-form-link" th:href="@{/register}">Regístrate</a>
            <img class="login-form-logo" src="/assets/logo-black.png" alt="Zero Shop Logo">
        </form>
    </main>
</body>
</html>
