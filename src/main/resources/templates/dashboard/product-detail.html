<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Producto</title>
</head>
<body>
    <a href="/dashboard/products">Volver a productos</a>

    <h1>Formulario de Producto</h1>

    <form method="post" th:action="${product?.id != null ? '/dashboard/products/' + product.id : '/dashboard/products/'}">
        <input type="hidden" name="_method" value="PUT" th:if="${product?.id != null}">

        <label for="code">Código de Producto:</label>
        <input type="text" id="code" name="code" th:value="${product?.code}" required>

        <label for="name">Nombre:</label>
        <input type="text" id="name" name="name" th:value="${product?.name}" required>

        <label for="description">Descripción:</label>
        <textarea id="description" name="description" rows="4" th:text="${product?.description}"></textarea>

        <label for="category">Categoría:</label>
        <select id="category" name="categoryId" required>
            <option value="">Seleccione una categoría</option>
            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Categoría</option>
        </select>

        <label for="initialPrice">Precio Inicial:</label>
        <input type="number" id="initialPrice" name="price" step="0.01" th:value="${product?.currentPrice}">

        <label for="initialStock">Stock Inicial:</label>
        <input type="number" id="initialStock" name="stock" th:value="${product?.stock}">

        <button type="submit">Guardar</button>
        <a href="/dashboard/products">Cancelar</a>
    </form>
</body>
</html>
