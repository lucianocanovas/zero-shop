<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Producto - Zero Shop Staff</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/styles/styles.css}" href="/styles/styles.css">
</head>
<body class="bg-light">

    <!-- Topbar -->
    <div th:replace="~{common/fragments/dashboard-nav :: dashboard-topbar}"></div>

    <!-- Offcanvas Móvil -->
    <div th:replace="~{common/fragments/dashboard-nav :: dashboard-offcanvas('products')}"></div>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Desktop -->
            <div class="col-md-3 col-lg-2 d-none d-md-block p-0">
                <div th:replace="~{common/fragments/dashboard-nav :: dashboard-sidebar('products')}"></div>
            </div>

            <!-- Contenido Principal -->
            <main class="col-12 col-md-9 col-lg-10 p-4">
                <!-- Migas de pan y Título -->
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h4 fw-bold text-dark mb-0" th:text="${product?.id != null ? 'Editar Producto' : 'Crear Nuevo Producto'}">Formulario de Producto Deportivo</h1>
                        <p class="text-muted small mb-0">Atributos requeridos: Imagen, Nombre, Descripción, Talle y Oferta</p>
                    </div>
                    <a th:href="@{/dashboard/products}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i>Volver a productos
                    </a>
                </div>

                <div class="row justify-content-center">
                    <div class="col-12 col-lg-9">
                        <div class="card border-0 shadow-sm p-4">
                            <form method="post" th:action="${product?.id != null ? '/dashboard/products/' + product.id : '/dashboard/products/'}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="_method" value="PUT" th:if="${product?.id != null}">

                                <div class="row g-3 mb-3">
                                    <div class="col-sm-4">
                                        <label for="code" class="form-label">Código (SKU)</label>
                                        <input type="text" id="code" name="code" class="form-control" th:value="${product?.code}" placeholder="ZR-1049" required>
                                    </div>
                                    <div class="col-sm-8">
                                        <label for="name" class="form-label">Nombre del Producto</label>
                                        <input type="text" id="name" name="name" class="form-control" th:value="${product?.name}" placeholder="Ej: Zapatillas Running Zero Pro" required>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-sm-6">
                                        <label for="category" class="form-label">Categoría Principal</label>
                                        <select id="category" name="categoryId" class="form-select" required>
                                            <option value="">Seleccione Categoría</option>
                                            <option value="HOMBRES">Hombres</option>
                                            <option value="MUJERES">Mujeres</option>
                                            <option value="NINOS">Niños</option>
                                            <option value="NINAS">Niñas</option>
                                        </select>
                                    </div>
                                    <div class="col-sm-6">
                                        <label for="subCategory" class="form-label">Subcategoría</label>
                                        <select id="subCategory" name="subCategoryId" class="form-select" required>
                                            <option value="">Seleccione Subcategoría</option>
                                            <option value="ROPA">Ropa</option>
                                            <option value="CALZADO" selected>Calzado</option>
                                            <option value="ACCESORIOS">Accesorios</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-sm-4">
                                        <label for="size" class="form-label">Talle (Enum Size)</label>
                                        <select id="size" name="size" class="form-select" required>
                                            <option value="XS">XS (Extra Small)</option>
                                            <option value="S">S (Small)</option>
                                            <option value="M" selected>M (Medium)</option>
                                            <option value="L">L (Large)</option>
                                            <option value="XL">XL (Extra Large)</option>
                                            <option value="XXL">XXL (Doble Extra Large)</option>
                                        </select>
                                    </div>
                                    <div class="col-sm-4">
                                        <label for="initialPrice" class="form-label">Precio ($)</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white">$</span>
                                            <input type="number" id="initialPrice" name="price" step="0.01" class="form-control" th:value="${product?.currentPrice}" placeholder="24990.00" required>
                                        </div>
                                    </div>
                                    <div class="col-sm-4">
                                        <label for="initialStock" class="form-label">Stock Inicial</label>
                                        <input type="number" id="initialStock" name="stock" class="form-control" th:value="${product?.stock}" placeholder="18" required>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="imageUrl" class="form-label">URL de Imagen del Producto</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white"><i class="bi bi-image"></i></span>
                                        <input type="text" id="imageUrl" name="imageUrl" class="form-control" placeholder="/assets/product-placeholder.jpg o URL web">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="description" class="form-label">Descripción Detallada</label>
                                    <textarea id="description" name="description" rows="3" class="form-control" placeholder="Describe los materiales, tela, amortiguación y características deportivas..." th:text="${product?.description}"></textarea>
                                </div>

                                <!-- Checkbox Oferta (Requisito: Indicar si el producto se encuentra en oferta) -->
                                <div class="form-check p-3 bg-light rounded-3 mb-4">
                                    <input class="form-check-input ms-0 me-2" type="checkbox" id="onSale" name="onSale" value="true" th:checked="${product?.onSale == true}">
                                    <label class="form-check-label fw-semibold text-danger" for="onSale">
                                        <i class="bi bi-fire me-1"></i>Producto en Oferta Especial (Aparecerá en la sección de ofertas)
                                    </label>
                                </div>

                                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                    <a th:href="@{/dashboard/products}" class="btn btn-outline-secondary">Cancelar</a>
                                    <button type="submit" class="btn btn-primary px-4">
                                        <i class="bi bi-check-lg me-1"></i>Guardar Producto
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
