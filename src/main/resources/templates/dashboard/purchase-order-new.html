<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Orden de Compra - Zero Shop Staff</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/styles/styles.css}" href="/styles/styles.css">
</head>
<body class="bg-light">

    <!-- Topbar -->
    <div th:replace="~{common/fragments/dashboard-nav :: dashboard-topbar}"></div>

    <!-- Offcanvas Móvil -->
    <div th:replace="~{common/fragments/dashboard-nav :: dashboard-offcanvas('purchase-orders')}"></div>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Desktop -->
            <div class="col-md-3 col-lg-2 d-none d-md-block p-0">
                <div th:replace="~{common/fragments/dashboard-nav :: dashboard-sidebar('purchase-orders')}"></div>
            </div>

            <!-- Contenido Principal -->
            <main class="col-12 col-md-9 col-lg-10 p-4">
                <!-- Migas de pan y Título -->
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h4 fw-bold text-dark mb-0">Nueva Orden de Compra</h1>
                        <p class="text-muted small mb-0">Emite una solicitud de reabastecimiento de mercadería a un proveedor</p>
                    </div>
                    <a th:href="@{/dashboard/purchase-orders}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i>Volver a Órdenes
                    </a>
                </div>

                <!-- Alertas Flash -->
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="row justify-content-center">
                    <div class="col-12 col-lg-9">
                        <div class="card border-0 shadow-sm p-4">
                            <form method="post" th:action="@{/dashboard/purchase-orders}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                                <div class="row g-3 mb-3">
                                    <div class="col-sm-6">
                                        <label for="supplierId" class="form-label fw-semibold">Proveedor</label>
                                        <select id="supplierId" name="supplierId" class="form-select" required>
                                            <option value="" disabled selected>Seleccione un Proveedor</option>
                                            <option th:each="sup : ${suppliers}" th:value="${sup.id}" th:text="${sup.name + (sup.cuit != null ? ' (CUIT: ' + sup.cuit + ')' : '')}">Distribuidora Textil S.A.</option>
                                        </select>
                                    </div>
                                    <div class="col-sm-6">
                                        <label for="officeId" class="form-label fw-semibold">Sucursal de Destino</label>
                                        <select id="officeId" name="officeId" class="form-select" required>
                                            <option value="" disabled selected>Seleccione Sucursal</option>
                                            <option th:each="off : ${offices}" th:value="${off.id}" th:text="${off.name}">Sucursal Central (Mendoza)</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-sm-6">
                                        <label for="productId" class="form-label fw-semibold">Producto a Comprar</label>
                                        <select id="productId" name="productId" class="form-select" required>
                                            <option value="" disabled selected>Seleccione Producto</option>
                                            <option th:each="prod : ${products}" th:value="${prod.id}" th:text="${prod.name + (prod.code != null ? ' (Código: ' + prod.code + ')' : '')}">Zapatillas Running Zero Pro</option>
                                        </select>
                                    </div>
                                    <div class="col-sm-3">
                                        <label for="quantity" class="form-label fw-semibold">Cantidad</label>
                                        <input type="number" id="quantity" name="quantity" class="form-control" min="1" value="10" required>
                                    </div>
                                    <div class="col-sm-3">
                                        <label for="unitPrice" class="form-label fw-semibold">Costo Unitario ($)</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white">$</span>
                                            <input type="number" id="unitPrice" name="unitPrice" step="0.01" min="0.01" class="form-control" value="10000.00" required>
                                        </div>
                                    </div>
                                </div>

                                <div class="p-3 bg-light rounded-3 mb-4 d-flex justify-content-between align-items-center">
                                    <div>
                                        <span class="text-muted small d-block">Estado Inicial de la Orden</span>
                                        <span class="badge bg-secondary-subtle text-secondary">Solicitada (Pendiente de Recepción)</span>
                                    </div>
                                    <div class="text-end">
                                        <span class="text-muted small d-block">Total Estimado</span>
                                        <strong class="fs-5 text-primary" id="calculatedTotal">$100.000,00</strong>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                    <a th:href="@{/dashboard/purchase-orders}" class="btn btn-outline-secondary">Cancelar</a>
                                    <button type="submit" class="btn btn-primary px-4">
                                        <i class="bi bi-send me-1"></i>Generar Orden de Compra
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const qtyInput = document.getElementById('quantity');
        const priceInput = document.getElementById('unitPrice');
        const totalDisplay = document.getElementById('calculatedTotal');
        function updateTotal() {
            const q = parseFloat(qtyInput.value) || 0;
            const p = parseFloat(priceInput.value) || 0;
            const total = q * p;
            totalDisplay.textContent = '$' + total.toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }
        if (qtyInput && priceInput && totalDisplay) {
            qtyInput.addEventListener('input', updateTotal);
            priceInput.addEventListener('input', updateTotal);
            updateTotal();
        }
    </script>
</body>
</html>
