<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Usuario - Zero Shop Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/styles/styles.css}" href="/styles/styles.css">
</head>
<body class="bg-light">

    <!-- Topbar -->
    <div th:replace="~{common/fragments/dashboard-nav :: dashboard-topbar}"></div>

    <!-- Offcanvas Móvil -->
    <div th:replace="~{common/fragments/dashboard-nav :: dashboard-offcanvas('users')}"></div>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Desktop -->
            <div class="col-md-3 col-lg-2 d-none d-md-block p-0">
                <div th:replace="~{common/fragments/dashboard-nav :: dashboard-sidebar('users')}"></div>
            </div>

            <!-- Contenido Principal -->
            <main class="col-12 col-md-9 col-lg-10 p-4">
                <!-- Migas de pan y Título -->
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h4 fw-bold text-dark mb-0">Nuevo Usuario</h1>
                        <p class="text-muted small mb-0">Registra una persona y su correspondiente cuenta de usuario en la plataforma</p>
                    </div>
                    <a th:href="@{/dashboard/admin/users}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i>Volver a Usuarios
                    </a>
                </div>

                <div class="row justify-content-center">
                    <div class="col-12 col-lg-9 col-xl-8">

                        <!-- Alertas de Error / Éxito -->
                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show py-2 small d-flex align-items-center mb-3" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2 fs-6"></i>
                            <span th:text="${error}">Ocurrió un error al crear el usuario.</span>
                            <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        <div th:if="${success}" class="alert alert-success alert-dismissible fade show py-2 small d-flex align-items-center mb-3" role="alert">
                            <i class="bi bi-check-circle-fill me-2 fs-6"></i>
                            <span th:text="${success}">Operación exitosa.</span>
                            <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <div class="card border-0 shadow-sm p-4">
                            <form method="post" th:action="@{/dashboard/admin/users}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                                <!-- Sección: Datos Personales -->
                                <div class="border-bottom pb-2 mb-3">
                                    <h6 class="text-uppercase text-secondary fw-bold small mb-0">
                                        <i class="bi bi-person-lines-fill me-1"></i>Datos Personales
                                    </h6>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-sm-6">
                                        <label for="firstName" class="form-label small fw-semibold">Nombre <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white text-muted"><i class="bi bi-person"></i></span>
                                            <input type="text" id="firstName" name="firstName" th:value="${firstName}" class="form-control" placeholder="Ej: Juan" required>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <label for="lastName" class="form-label small fw-semibold">Apellido <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white text-muted"><i class="bi bi-person"></i></span>
                                            <input type="text" id="lastName" name="lastName" th:value="${lastName}" class="form-control" placeholder="Ej: Pérez" required>
                                        </div>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-sm-5">
                                        <label for="idType" class="form-label small fw-semibold">Tipo Documento <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white text-muted"><i class="bi bi-card-heading"></i></span>
                                            <select class="form-select" id="idType" name="idType" required>
                                                <option th:each="type : ${idTypes != null ? idTypes : T(ingsoftware.zeroshop.enums.IDType).values()}"
                                                        th:value="${type.name()}"
                                                        th:text="${type.name()}"
                                                        th:selected="${selectedIdType != null and selectedIdType.name() == type.name() or (selectedIdType == null and type.name() == 'DNI')}">
                                                    DNI
                                                </option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-sm-7">
                                        <label for="idNumber" class="form-label small fw-semibold">Número de Documento <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white text-muted"><i class="bi bi-credit-card-2-front"></i></span>
                                            <input type="text" id="idNumber" name="idNumber" th:value="${idNumber}" class="form-control" placeholder="Ej: 40123456" required>
                                        </div>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label for="dateOfBirth" class="form-label small fw-semibold">Fecha de Nacimiento <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white text-muted"><i class="bi bi-calendar3"></i></span>
                                        <input type="date" id="dateOfBirth" name="dateOfBirth" th:value="${dateOfBirth}" class="form-control" required>
                                    </div>
                                </div>

                                <!-- Sección: Datos de Cuenta y Rol -->
                                <div class="border-bottom pb-2 mb-3 pt-2">
                                    <h6 class="text-uppercase text-secondary fw-bold small mb-0">
                                        <i class="bi bi-shield-lock-fill me-1"></i>Cuenta y Permisos
                                    </h6>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-sm-7">
                                        <label for="username" class="form-label small fw-semibold">Correo Electrónico (Usuario) <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white text-muted"><i class="bi bi-envelope"></i></span>
                                            <input type="email" id="username" name="username" th:value="${username}" class="form-control" placeholder="usuario@zeroshop.com" required>
                                        </div>
                                    </div>
                                    <div class="col-sm-5">
                                        <label for="role" class="form-label small fw-semibold">Rol de Acceso <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white text-muted"><i class="bi bi-person-badge"></i></span>
                                            <select id="role" name="role" class="form-select" required>
                                                <option value="CLIENT" th:selected="${selectedRole != null and selectedRole.name() == 'CLIENT' or selectedRole == null}">CLIENT (Cliente)</option>
                                                <option value="EMPLOYEE" th:selected="${selectedRole != null and selectedRole.name() == 'EMPLOYEE'}">EMPLOYEE (Empleado)</option>
                                                <option value="ADMIN" th:selected="${selectedRole != null and selectedRole.name() == 'ADMIN'}">ADMIN (Administrador)</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label for="password" class="form-label small fw-semibold">Contraseña de Acceso <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white text-muted"><i class="bi bi-key"></i></span>
                                        <input type="password" id="password" name="password" class="form-control" placeholder="Mínimo 6 caracteres" required minlength="6">
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                    <a th:href="@{/dashboard/admin/users}" class="btn btn-outline-secondary">Cancelar</a>
                                    <button type="submit" class="btn btn-primary px-4">
                                        <i class="bi bi-person-plus me-1"></i>Crear Usuario
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
