<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Sucursal - Zero Shop Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/styles/styles.css}" href="/styles/styles.css">
</head>
<body class="bg-light">

    <!-- Topbar -->
    <div th:replace="~{common/fragments/dashboard-nav :: dashboard-topbar}"></div>

    <!-- Offcanvas Móvil -->
    <div th:replace="~{common/fragments/dashboard-nav :: dashboard-offcanvas('offices')}"></div>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Desktop -->
            <div class="col-md-3 col-lg-2 d-none d-md-block p-0">
                <div th:replace="~{common/fragments/dashboard-nav :: dashboard-sidebar('offices')}"></div>
            </div>

            <!-- Contenido Principal -->
            <main class="col-12 col-md-9 col-lg-10 p-4">
                <!-- Migas de pan y Título -->
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h4 fw-bold text-dark mb-0">Nueva Sucursal</h1>
                        <p class="text-muted small mb-0">Configura la ubicación física y datos de contacto de una nueva tienda o depósito</p>
                    </div>
                    <a th:href="@{/dashboard/admin/offices}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i>Volver a Sucursales
                    </a>
                </div>

                <div class="row justify-content-center">
                    <div class="col-12 col-lg-8">
                        <div class="card border-0 shadow-sm p-4">
                            <form method="post" th:action="@{/dashboard/admin/offices}" th:object="${officeDTO}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                                <div class="row g-3 mb-3">
                                    <div class="col-sm-7">
                                        <label for="name" class="form-label">Nombre de la Sucursal</label>
                                        <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Ej: Sucursal Central" required>
                                    </div>
                                    <div class="col-sm-5">
                                        <label for="cuit" class="form-label">CUIT</label>
                                        <input type="text" id="cuit" th:field="*{cuit}" class="form-control" placeholder="30-71123456-8" required>
                                    </div>
                                </div>

                                <h5 class="mt-4 mb-3 border-bottom pb-2">Ubicación y Contacto</h5>
                                <div th:replace="~{common/fragments/address-form :: address-fields('address')}"></div>

                                <div class="row g-3 mb-4 mt-1">
                                    <div class="col-sm-6">
                                        <label for="phone" class="form-label">Teléfono</label>
                                        <input type="text" id="phone" th:field="*{phone}" class="form-control" placeholder="+54 11 4321-0001">
                                    </div>
                                    <div class="col-sm-6">
                                        <label for="type" class="form-label">Tipo de Establecimiento</label>
                                        <select id="type" th:field="*{type}" class="form-select">
                                            <option value="HEADQUARTERS">Sede Central</option>
                                            <option value="BRANCH" selected>Sucursal (Punto de Venta)</option>
                                            <option value="WAREHOUSE">Depósito</option>
                                            <option value="DISTRIBUTION_CENTER">Centro de Distribución</option>
                                            <option value="OTHER">Otro</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                    <a th:href="@{/dashboard/admin/offices}" class="btn btn-outline-secondary">Cancelar</a>
                                    <button type="submit" class="btn btn-primary px-4">
                                        <i class="bi bi-plus-lg me-1"></i>Crear Sucursal
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
