<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario - Zero Shop Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/styles/styles.css}" href="/styles/styles.css">
</head>
<body class="bg-light">

    <!-- Topbar -->
    <div th:replace="~{common/fragments/dashboard-nav :: dashboard-topbar}"></div>

    <!-- Offcanvas Móvil -->
    <div th:replace="~{common/fragments/dashboard-nav :: dashboard-offcanvas('users')}"></div>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Desktop -->
            <div class="col-md-3 col-lg-2 d-none d-md-block p-0">
                <div th:replace="~{common/fragments/dashboard-nav :: dashboard-sidebar('users')}"></div>
            </div>

            <!-- Contenido Principal -->
            <main class="col-12 col-md-9 col-lg-10 p-4">
                <!-- Migas de pan y Título -->
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h4 fw-bold text-dark mb-0">Editar Usuario</h1>
                        <p class="text-muted small mb-0">Modifica los datos personales, credenciales o rol del usuario</p>
                    </div>
                    <a th:href="@{/dashboard/admin/users}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i>Volver a Usuarios
                    </a>
                </div>

                <div class="row justify-content-center">
                    <div class="col-12 col-lg-8">
                        <div class="card border-0 shadow-sm p-4">
                            <form method="post" th:action="@{/dashboard/admin/users/{id}(id=${user != null ? user.id : '00000000-0000-0000-0000-000000000001'})}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="_method" value="PUT">

                                <div class="row g-3 mb-3">
                                    <div class="col-sm-6">
                                        <label for="firstName" class="form-label">Nombre</label>
                                        <input type="text" id="firstName" name="firstName" class="form-control" th:value="${user?.person?.firstName}" placeholder="Nombre">
                                    </div>
                                    <div class="col-sm-6">
                                        <label for="lastName" class="form-label">Apellido</label>
                                        <input type="text" id="lastName" name="lastName" class="form-control" th:value="${user?.person?.lastName}" placeholder="Apellido">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="username" class="form-label">Correo Electrónico (Usuario)</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                                        <input type="email" id="username" name="username" class="form-control" th:value="${user?.username}" placeholder="usuario@zeroshop.com" required>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-sm-6">
                                        <label for="role" class="form-label">Rol de Acceso</label>
                                        <select id="role" name="role" class="form-select" required>
                                            <option value="CLIENT" th:selected="${user?.role?.name() == 'CLIENT'}">CLIENT (Cliente Tienda)</option>
                                            <option value="EMPLOYEE" th:selected="${user?.role?.name() == 'EMPLOYEE'}">EMPLOYEE (Personal de Sucursal)</option>
                                            <option value="ADMIN" th:selected="${user?.role?.name() == 'ADMIN'}">ADMIN (Administrador Total)</option>
                                        </select>
                                    </div>
                                    <div class="col-sm-6">
                                        <label for="password" class="form-label">Contraseña <span class="text-muted small fw-normal">(opcional al editar)</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white"><i class="bi bi-key"></i></span>
                                            <input type="password" id="password" name="password" class="form-control" placeholder="Dejar en blanco para mantener">
                                        </div>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                    <a th:href="@{/dashboard/admin/users}" class="btn btn-outline-secondary">Cancelar</a>
                                    <button type="submit" class="btn btn-primary px-4">
                                        <i class="bi bi-check-lg me-1"></i>Guardar Cambios
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
