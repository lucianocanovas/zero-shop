<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto - Zero Shop Staff</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/styles/styles.css}" href="/styles/styles.css">
</head>
<body class="bg-light">

    <!-- Topbar -->
    <div th:replace="~{common/fragments/dashboard-nav :: dashboard-topbar}"></div>

    <!-- Offcanvas Móvil -->
    <div th:replace="~{common/fragments/dashboard-nav :: dashboard-offcanvas('products')}"></div>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Desktop -->
            <div class="col-md-3 col-lg-2 d-none d-md-block p-0">
                <div th:replace="~{common/fragments/dashboard-nav :: dashboard-sidebar('products')}"></div>
            </div>

            <!-- Contenido Principal -->
            <main class="col-12 col-md-9 col-lg-10 p-4">
                <!-- Migas de pan y Título -->
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h4 fw-bold text-dark mb-0">Editar Producto</h1>
                        <p class="text-muted small mb-0">Actualiza especificaciones, categorías, descripción y precio del producto</p>
                    </div>
                    <div class="d-flex gap-2">
                        <a th:href="@{/dashboard/products/{id}/prices(id=${product != null ? product.id : '00000000-0000-0000-0000-000000000001'})}" class="btn btn-outline-primary btn-sm">
                            <i class="bi bi-currency-dollar me-1"></i>Historial de Precios
                        </a>
                        <a th:href="@{/dashboard/products}" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-arrow-left me-1"></i>Volver a Productos
                        </a>
                    </div>
                </div>

                <div class="row justify-content-center">
                    <div class="col-12 col-lg-9">
                        <div class="card border-0 shadow-sm p-4">
                            <form method="post" th:action="@{/dashboard/products/{id}(id=${product != null ? product.id : '00000000-0000-0000-0000-000000000001'})}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="_method" value="PUT">

                                <div class="row g-3 mb-3">
                                    <div class="col-sm-4">
                                        <label for="code" class="form-label">Código (SKU)</label>
                                        <input type="text" id="code" name="code" class="form-control" th:value="${product?.code}" placeholder="ZR-1049" required>
                                    </div>
                                    <div class="col-sm-8">
                                        <label for="name" class="form-label">Nombre del Producto</label>
                                        <input type="text" id="name" name="name" class="form-control" th:value="${product?.name}" placeholder="Ej: Zapatillas Running Zero Pro" required>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-sm-6">
                                        <label for="category" class="form-label">Categoría Principal</label>
                                        <select id="category" name="categoryId" class="form-select" required>
                                            <option value="">Seleccione Categoría</option>
                                            <option value="HOMBRES" th:selected="${product?.category?.name == 'Hombres' or product?.category?.name == 'HOMBRES'}">Hombres</option>
                                            <option value="MUJERES" th:selected="${product?.category?.name == 'Mujeres' or product?.category?.name == 'MUJERES'}">Mujeres</option>
                                            <option value="NINOS" th:selected="${product?.category?.name == 'Niños' or product?.category?.name == 'NINOS'}">Niños</option>
                                            <option value="NINAS" th:selected="${product?.category?.name == 'Niñas' or product?.category?.name == 'NINAS'}">Niñas</option>
                                            <option value="UNISEX" th:selected="${product?.category?.name == 'Unisex' or product?.category?.name == 'UNISEX'}">Unisex</option>
                                        </select>
                                    </div>
                                    <div class="col-sm-6">
                                        <label for="subCategory" class="form-label">Subcategoría</label>
                                        <select id="subCategory" name="subCategoryId" class="form-select">
                                            <option value="">Seleccione Subcategoría</option>
                                            <option value="CALZADO" selected>Calzado Deportivo</option>
                                            <option value="ROPA">Indumentaria / Ropa</option>
                                            <option value="ACCESORIOS">Accesorios y Equipamiento</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-sm-6">
                                        <label for="basePrice" class="form-label">Precio de Venta Actual ($)</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white">$</span>
                                            <input type="number" id="basePrice" name="basePrice" class="form-control" th:value="${product != null ? '24999.00' : '18500.00'}" step="0.01" min="0" required>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <label for="discount" class="form-label">Descuento de Oferta (%)</label>
                                        <div class="input-group">
                                            <input type="number" id="discount" name="discount" class="form-control" th:value="${product != null ? '10' : '0'}" min="0" max="100">
                                            <span class="input-group-text bg-white">%</span>
                                        </div>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="description" class="form-label">Descripción</label>
                                    <textarea id="description" name="description" rows="3" class="form-control" th:text="${product?.description}" placeholder="Detalles del producto..."></textarea>
                                </div>

                                <div class="mb-4">
                                    <label for="imageUrl" class="form-label">URL de Imagen Principal</label>
                                    <input type="text" id="imageUrl" name="imageUrl" class="form-control" th:value="${product != null and !product.images.empty ? product.images[0].url : '/assets/products/shoes-1.jpg'}">
                                </div>

                                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                    <a th:href="@{/dashboard/products}" class="btn btn-outline-secondary">Cancelar</a>
                                    <button type="submit" class="btn btn-primary px-4">
                                        <i class="bi bi-check-lg me-1"></i>Guardar Cambios
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
