<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Orden de Venta</title>
</head>
<body>
    <a href="/dashboard/sale-orders">Volver a órdenes</a>

    <h1>Detalle de Orden de Venta</h1>

    <p><strong>ID Orden:</strong> <span th:text="${order?.id}">ID</span></p>
    <p><strong>Cliente:</strong> <span th:text="${order?.client?.person?.firstName}">Cliente</span></p>
    <p><strong>Estado Actual:</strong> <span th:text="${order?.status}">PENDIENTE</span></p>

    <h2>Actualizar Estado</h2>
    <form method="post" th:action="@{/dashboard/sale-orders/{id}/status(id=${order?.id})}">
        <input type="hidden" name="_method" value="PUT">
        <label for="status">Nuevo Estado:</label>
        <select id="status" name="status">
            <option value="PENDING">PENDIENTE</option>
            <option value="PAID">PAGO REALIZADO</option>
            <option value="SHIPPED">ENVIADO</option>
            <option value="DELIVERED">ENTREGADO</option>
            <option value="CANCELLED">CANCELADO</option>
        </select>
        <button type="submit">Cambiar Estado</button>
    </form>

    <h2>Items de la Orden</h2>
    <table>
        <thead>
            <tr>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Precio Unitario</th>
                <th>Subtotal</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="detail : ${order?.details}">
                <td th:text="${detail.product?.name}">Producto</td>
                <td th:text="${detail.quantity}">1</td>
                <td th:text="${detail.price}">$0.00</td>
                <td th:text="${detail.subtotal}">$0.00</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="3">Total:</th>
                <td th:text="${order?.total}">$0.00</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
