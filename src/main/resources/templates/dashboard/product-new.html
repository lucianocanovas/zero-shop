<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Producto - Zero Shop Staff</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/styles/styles.css}" href="/styles/styles.css">
</head>
<body class="bg-light">

    <!-- Topbar -->
    <div th:replace="~{common/fragments/dashboard-nav :: dashboard-topbar}"></div>

    <!-- Offcanvas Móvil -->
    <div th:replace="~{common/fragments/dashboard-nav :: dashboard-offcanvas('products')}"></div>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Desktop -->
            <div class="col-md-3 col-lg-2 d-none d-md-block p-0">
                <div th:replace="~{common/fragments/dashboard-nav :: dashboard-sidebar('products')}"></div>
            </div>

            <!-- Contenido Principal -->
            <main class="col-12 col-md-9 col-lg-10 p-4">
                <!-- Migas de pan y Título -->
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h4 fw-bold text-dark mb-0">Nuevo Producto</h1>
                        <p class="text-muted small mb-0">Carga un nuevo artículo al catálogo con sus especificaciones y precio inicial</p>
                    </div>
                    <a th:href="@{/dashboard/products}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i>Volver a Productos
                    </a>
                </div>

                <div class="row justify-content-center">
                    <div class="col-12 col-lg-9">
                        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <div class="card border-0 shadow-sm p-4">
                            <form method="post" th:action="@{/dashboard/products}" enctype="multipart/form-data">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                                <div class="row g-3 mb-3">
                                    <div class="col-sm-4">
                                        <label for="code" class="form-label">Código (SKU)</label>
                                        <input type="text" id="code" name="code" class="form-control" placeholder="ZR-1049" required>
                                    </div>
                                    <div class="col-sm-8">
                                        <label for="name" class="form-label">Nombre del Producto</label>
                                        <input type="text" id="name" name="name" class="form-control" placeholder="Ej: Zapatillas Running Zero Pro" required>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-sm-6">
                                        <label for="subCategoryId" class="form-label">Categoría / Subcategoría</label>
                                        <select id="subCategoryId" name="subCategoryId" class="form-select" required>
                                            <option value="" selected>Seleccione Subcategoría...</option>
                                            <option th:each="sub : ${subCategories}" 
                                                    th:value="${sub.id}" 
                                                    th:text="${(sub.category != null ? sub.category.name + ' - ' : '') + sub.name}">
                                                Hombres - Calzado
                                            </option>
                                        </select>
                                    </div>
                                    <div class="col-sm-6">
                                        <label for="size" class="form-label">Talle</label>
                                        <select id="size" name="size" class="form-select" required>
                                            <option value="" selected>Seleccione Talle...</option>
                                            <option th:each="s : ${sizes}" th:value="${s}" th:text="${s}">M</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-sm-12">
                                        <label for="basePrice" class="form-label">Precio de Venta ($)</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white">$</span>
                                            <input type="number" id="basePrice" name="basePrice" class="form-control" placeholder="18500.00" step="0.01" min="0" required>
                                        </div>
                                    </div>
                                    <div class="col-sm-12">
                                        <div class="form-check form-switch p-3 bg-light rounded-3 border">
                                            <input class="form-check-input ms-0 me-2" type="checkbox" id="onSale" name="onSale" value="true">
                                            <label class="form-check-label fw-bold text-dark" for="onSale">
                                                <i class="bi bi-fire text-danger me-1"></i>Producto en Oferta / Promoción Especial
                                            </label>
                                            <div class="form-text small text-muted">Marcar si el producto debe publicarse directamente con precio de oferta.</div>
                                        </div>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="description" class="form-label">Descripción Detallada</label>
                                    <textarea id="description" name="description" rows="3" class="form-control" placeholder="Detalles de materiales, tecnologías de amortiguación, respirabilidad y uso recomendado..."></textarea>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-bold"><i class="bi bi-image me-1"></i>Imagen del Producto</label>
                                    <div class="card p-3 bg-light border rounded-3">
                                        <!-- Opción 1: Cargar desde la PC -->
                                        <div class="mb-3">
                                            <label for="imageFile" class="form-label small fw-semibold text-primary">
                                                <i class="bi bi-pc-display me-1"></i>Cargar imagen desde la PC
                                            </label>
                                            <input type="file" id="imageFile" name="imageFile" class="form-control" accept="image/png, image/jpeg, image/webp, image/gif, image/svg+xml">
                                            <div class="form-text small text-muted">Formatos admitidos: JPG, PNG, WEBP, GIF, SVG (máx. 10MB).</div>
                                        </div>

                                        <div class="d-flex align-items-center my-2">
                                            <hr class="flex-grow-1 my-0">
                                            <span class="px-2 text-muted small fw-semibold">O bien</span>
                                            <hr class="flex-grow-1 my-0">
                                        </div>

                                        <!-- Opción 2: URL externa -->
                                        <div class="mb-2">
                                            <label for="imageUrl" class="form-label small fw-semibold text-secondary">
                                                <i class="bi bi-link-45deg me-1"></i>Ingresar URL de imagen externa o relativa
                                            </label>
                                            <input type="text" id="imageUrl" name="imageUrl" class="form-control" placeholder="https://... o /assets/...">
                                        </div>

                                        <!-- Vista previa dinámica -->
                                        <div id="imagePreviewContainer" class="mt-3 text-center d-none">
                                            <label class="form-label text-muted small d-block">Vista previa:</label>
                                            <img id="imagePreview" src="#" class="img-thumbnail rounded-3 shadow-sm" style="max-height: 180px; object-fit: contain;" alt="Vista previa">
                                        </div>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                    <a th:href="@{/dashboard/products}" class="btn btn-outline-secondary">Cancelar</a>
                                    <button type="submit" class="btn btn-primary px-4">
                                        <i class="bi bi-plus-lg me-1"></i>Crear Producto
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const imageFileInput = document.getElementById('imageFile');
        const imageUrlInput = document.getElementById('imageUrl');
        const previewContainer = document.getElementById('imagePreviewContainer');
        const previewImg = document.getElementById('imagePreview');

        if (imageFileInput) {
            imageFileInput.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        previewImg.src = e.target.result;
                        previewContainer.classList.remove('d-none');
                    };
                    reader.readAsDataURL(this.files[0]);
                }
            });
        }

        if (imageUrlInput) {
            imageUrlInput.addEventListener('input', function() {
                if (this.value && this.value.trim() !== '') {
                    previewImg.src = this.value.trim();
                    previewContainer.classList.remove('d-none');
                } else if (!imageFileInput.files || !imageFileInput.files[0]) {
                    previewContainer.classList.add('d-none');
                }
            });
        }
    </script>
</body>
</html>
