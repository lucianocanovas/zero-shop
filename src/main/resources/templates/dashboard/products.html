<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos - Zero Shop</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/styles/styles.css}" href="/styles/styles.css">
</head>
<body class="bg-light">

    <!-- Topbar -->
    <div th:replace="~{common/fragments/dashboard-nav :: dashboard-topbar}"></div>

    <!-- Offcanvas Móvil -->
    <div th:replace="~{common/fragments/dashboard-nav :: dashboard-offcanvas('products')}"></div>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Desktop -->
            <div class="col-md-3 col-lg-2 d-none d-md-block p-0">
                <div th:replace="~{common/fragments/dashboard-nav :: dashboard-sidebar('products')}"></div>
            </div>

            <!-- Contenido Principal -->
            <main class="col-12 col-md-9 col-lg-10 p-4">
                <!-- Mensajes Flash -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-3" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Migas de pan y Título -->
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h4 fw-bold text-dark mb-0">Catálogo de Productos</h1>
                        <p class="text-muted small mb-0">Administra los artículos, precios y disponibilidades en tienda</p>
                    </div>
                    <div sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/dashboard/products/new}" class="btn btn-primary btn-sm">
                            <i class="bi bi-plus-lg me-1"></i>Nuevo Producto
                        </a>
                    </div>
                </div>

                <!-- Tabla de Productos -->
                <div class="card border-0 shadow-sm overflow-hidden">
                    <div class="table-responsive">
                        <table class="table table-custom align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Nombre del Producto</th>
                                    <th>Categoría / Subcategoría</th>
                                    <th>Talle</th>
                                    <th>Precio</th>
                                    <th>Stock</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Iteración dinámica si existen productos -->
                                <tr th:each="product : ${products}" th:if="${products != null and !products.empty}">
                                    <td class="fw-semibold text-muted" th:text="${product.code}">ZR-1001</td>
                                    <td class="fw-bold text-dark" th:text="${product.name}">Producto</td>
                                    <td>
                                        <span th:text="${product.category != null ? product.category.name : 'General'}">Categoría</span>
                                        <small class="text-muted" th:if="${product.subCategory != null}" th:text="' / ' + ${product.subCategory.name}"></small>
                                    </td>
                                    <td>
                                        <span class="badge bg-secondary-subtle text-secondary" th:text="${product.size != null ? product.size : '-'}">M</span>
                                    </td>
                                    <td class="fw-bold text-primary" th:text="'$' + ${#numbers.formatDecimal(product.currentPrice != null ? product.currentPrice : 0, 1, 2)}">$0.00</td>
                                    <td>
                                        <span class="badge" th:classappend="${product.stock > 5 ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'}" th:text="${product.stock} + ' un.'">
                                            0 un.
                                        </span>
                                    </td>
                                    <td class="text-end">
                                        <div class="btn-group btn-group-sm">
                                            <!-- Para Administradores: Editar -->
                                            <a sec:authorize="hasRole('ADMIN')" th:href="@{/dashboard/products/{id}(id=${product.id})}" class="btn btn-outline-secondary" title="Editar Producto">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <!-- Para Empleados: Ver Detalle -->
                                            <a sec:authorize="!hasRole('ADMIN')" th:href="@{/dashboard/products/{id}(id=${product.id})}" class="btn btn-outline-secondary" title="Ver Detalle">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                            <!-- Historial de Precios -->
                                            <a th:href="@{/dashboard/products/{id}/prices(id=${product.id})}" class="btn btn-outline-secondary" title="Historial Precios">
                                                <i class="bi bi-currency-dollar"></i>
                                            </a>
                                            <!-- Eliminar solo para Administradores -->
                                            <form sec:authorize="hasRole('ADMIN')" method="post" th:action="@{/dashboard/products/{id}(id=${product.id})}" class="d-inline">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                <input type="hidden" name="_method" value="DELETE">
                                                <button type="submit" class="btn btn-outline-danger" title="Eliminar" onclick="return confirm('¿Seguro que deseas eliminar este producto?')">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>

                                <!-- Fallback cuando no hay productos registrados -->
                                <tr th:if="${products == null or products.empty}">
                                    <td colspan="7" class="text-center py-4 text-muted">
                                        <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                        No hay productos registrados en el sistema.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
