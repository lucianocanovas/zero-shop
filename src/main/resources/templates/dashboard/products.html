<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos - Zero Shop</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/styles/styles.css}" href="/styles/styles.css">
</head>
<body class="bg-light">

    <!-- Topbar -->
    <div th:replace="~{common/fragments/dashboard-nav :: dashboard-topbar}"></div>

    <!-- Offcanvas Móvil -->
    <div th:replace="~{common/fragments/dashboard-nav :: dashboard-offcanvas('products')}"></div>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Desktop -->
            <div class="col-md-3 col-lg-2 d-none d-md-block p-0">
                <div th:replace="~{common/fragments/dashboard-nav :: dashboard-sidebar('products')}"></div>
            </div>

            <!-- Contenido Principal -->
            <main class="col-12 col-md-9 col-lg-10 p-4">
                <!-- Mensajes Flash -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-3" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Migas de pan y Título -->
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h4 fw-bold text-dark mb-0">Catálogo de Productos</h1>
                        <p class="text-muted small mb-0">Administra los artículos, precios y disponibilidades en tienda</p>
                    </div>
                    <div sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/dashboard/products/new}" class="btn btn-primary btn-sm">
                            <i class="bi bi-plus-lg me-1"></i>Nuevo Producto
                        </a>
                    </div>
                </div>

                <!-- Barra de Búsqueda y Filtros -->
                <div class="card border-0 shadow-sm p-3 mb-4">
                    <form id="filterForm" method="get" th:action="@{/dashboard/products}" class="row g-2 align-items-end">
                        <input type="hidden" name="page" id="pageInput" th:value="${pageResult != null ? pageResult.pageNumber : 1}">

                        <div class="col-12 col-md-3">
                            <label for="search" class="form-label small fw-semibold text-muted">Buscar artículo</label>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                                <input type="text" class="form-control" id="search" name="search" th:value="${search}" placeholder="Nombre o SKU...">
                            </div>
                        </div>

                        <div class="col-6 col-md-2">
                            <label for="categoryId" class="form-label small fw-semibold text-muted">Categoría</label>
                            <select id="categoryId" name="categoryId" class="form-select form-select-sm">
                                <option value="">Todas</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${categoryId != null and categoryId == cat.id}">Categoría</option>
                            </select>
                        </div>

                        <div class="col-6 col-md-2">
                            <label for="size" class="form-label small fw-semibold text-muted">Talle</label>
                            <select id="size" name="size" class="form-select form-select-sm">
                                <option value="">Todos</option>
                                <option th:each="s : ${sizes}" th:value="${s}" th:text="${s}" th:selected="${size != null and size == s}">Talle</option>
                            </select>
                        </div>

                        <div class="col-6 col-md-2">
                            <label for="stockStatus" class="form-label small fw-semibold text-muted">Stock</label>
                            <select id="stockStatus" name="stockStatus" class="form-select form-select-sm">
                                <option value="">Todos</option>
                                <option value="in_stock" th:selected="${stockStatus == 'in_stock'}">Con Stock</option>
                                <option value="out_of_stock" th:selected="${stockStatus == 'out_of_stock'}">Sin Stock (0)</option>
                            </select>
                        </div>

                        <div class="col-6 col-md-1">
                            <label for="onSale" class="form-label small fw-semibold text-muted">Oferta</label>
                            <select id="onSale" name="onSale" class="form-select form-select-sm">
                                <option value="">Todas</option>
                                <option value="true" th:selected="${onSale == true}">Sí</option>
                                <option value="false" th:selected="${onSale == false}">No</option>
                            </select>
                        </div>

                        <div class="col-12 col-md-2 d-flex gap-1">
                            <button type="submit" class="btn btn-primary btn-sm flex-fill" title="Filtrar">
                                <i class="bi bi-funnel me-1"></i>Filtrar
                            </button>
                            <a th:href="@{/dashboard/products}" class="btn btn-outline-secondary btn-sm" title="Limpiar">
                                <i class="bi bi-x-lg"></i>
                            </a>
                        </div>
                    </form>
                </div>

                <!-- Tabla de Productos -->
                <div class="card border-0 shadow-sm overflow-hidden">
                    <div class="table-responsive">
                        <table class="table table-custom align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Nombre del Producto</th>
                                    <th>Categoría / Subcategoría</th>
                                    <th>Talle</th>
                                    <th>Oferta</th>
                                    <th>Precio</th>
                                    <th>Stock</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Iteración dinámica si existen productos -->
                                <tr th:each="product : ${products}" th:if="${products != null and !products.empty}">
                                    <td class="fw-semibold text-muted" th:text="${product.code}">ZR-1001</td>
                                    <td class="fw-bold text-dark" th:text="${product.name}">Producto</td>
                                    <td>
                                        <span th:text="${product.category != null ? product.category.name : 'General'}">Categoría</span>
                                        <small class="text-muted" th:if="${product.subCategory != null}" th:text="' / ' + ${product.subCategory.name}"></small>
                                    </td>
                                    <td>
                                        <span class="badge bg-secondary-subtle text-secondary" th:text="${product.size != null ? product.size : '-'}">M</span>
                                    </td>
                                    <td>
                                        <span th:if="${product.onSale}" class="badge bg-danger"><i class="bi bi-fire me-1"></i>En Oferta</span>
                                        <span th:unless="${product.onSale}" class="badge bg-light text-muted border">Regular</span>
                                    </td>
                                    <td>
                                        <span class="fw-bold" th:classappend="${product.onSale ? 'text-danger' : 'text-primary'}" th:text="'$' + ${#numbers.formatDecimal(product.currentPrice != null ? product.currentPrice : 0, 1, 2)}">$0.00</span>
                                    </td>
                                    <td>
                                        <span class="badge" th:classappend="${product.stock > 5 ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'}" th:text="${product.stock} + ' un.'">
                                            0 un.
                                        </span>
                                    </td>
                                    <td class="text-end">
                                        <div class="btn-group btn-group-sm">
                                            <!-- Para Administradores: Editar -->
                                            <a sec:authorize="hasRole('ADMIN')" th:href="@{/dashboard/products/{id}(id=${product.id})}" class="btn btn-icon btn-outline-secondary" title="Editar Producto">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <!-- Para Empleados: Ver Detalle -->
                                            <a sec:authorize="!hasRole('ADMIN')" th:href="@{/dashboard/products/{id}(id=${product.id})}" class="btn btn-icon btn-outline-secondary" title="Ver Detalle">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                            <!-- Historial de Precios -->
                                            <a th:href="@{/dashboard/products/{id}/prices(id=${product.id})}" class="btn btn-icon btn-outline-secondary" title="Historial Precios">
                                                <i class="bi bi-currency-dollar"></i>
                                            </a>
                                            <!-- Eliminar solo para Administradores -->
                                            <form sec:authorize="hasRole('ADMIN')" method="post" th:action="@{/dashboard/products/{id}(id=${product.id})}" class="d-inline">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                <input type="hidden" name="_method" value="DELETE">
                                                <button type="submit" class="btn btn-icon btn-outline-danger" title="Eliminar" onclick="return confirm('¿Seguro que deseas eliminar este producto?')">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>

                                <!-- Fallback cuando no hay productos registrados -->
                                <tr th:if="${products == null or products.empty}">
                                    <td colspan="8" class="text-center py-4 text-muted">
                                        <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                        No hay productos registrados en el sistema.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Paginación Reutilizable -->
                <div th:replace="~{common/fragments/pagination :: paginationBar(${pageResult})}"></div>
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
