<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Proveedores - Zero Shop Staff</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/styles/styles.css}" href="/styles/styles.css">
</head>

<body class="bg-light">

    <!-- Topbar -->
    <div th:replace="~{common/fragments/dashboard-nav :: dashboard-topbar}"></div>

    <!-- Offcanvas Móvil -->
    <div th:replace="~{common/fragments/dashboard-nav :: dashboard-offcanvas('providers')}"></div>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Desktop -->
            <div class="col-md-3 col-lg-2 d-none d-md-block p-0">
                <div th:replace="~{common/fragments/dashboard-nav :: dashboard-sidebar('providers')}"></div>
            </div>

            <!-- Contenido Principal -->
            <main class="col-12 col-md-9 col-lg-10 p-4">
                <!-- Migas de pan y Título -->
                <div
                    class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h4 fw-bold text-dark mb-0">Proveedores Registrados</h1>
                        <p class="text-muted small mb-0">Gestión de contactos comerciales, compras mayoristas y
                            abastecimiento</p>
                    </div>
                    <a th:href="@{/dashboard/providers/new}" class="btn btn-primary btn-sm">
                        <i class="bi bi-plus-lg me-1"></i>Nuevo Proveedor
                    </a>
                </div>

                <!-- Barra de Búsqueda y Filtros -->
                <div class="card border-0 shadow-sm p-3 mb-4">
                    <form id="filterForm" method="get" th:action="@{/dashboard/providers}" class="row g-2 align-items-end">
                        <input type="hidden" name="page" id="pageInput" th:value="${pageResult != null ? pageResult.pageNumber : 1}">

                        <div class="col-12 col-md-7">
                            <label for="search" class="form-label small fw-semibold text-muted">Buscar proveedor</label>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                                <input type="text" class="form-control" id="search" name="search" th:value="${search}" placeholder="Razón social, CUIT, email, teléfono...">
                            </div>
                        </div>

                        <div class="col-6 col-md-3">
                            <label for="hasContact" class="form-label small fw-semibold text-muted">Datos de contacto</label>
                            <select id="hasContact" name="hasContact" class="form-select form-select-sm">
                                <option value="">Todos</option>
                                <option value="true" th:selected="${hasContact == true}">Con contacto (email/teléfono)</option>
                                <option value="false" th:selected="${hasContact == false}">Sin contacto</option>
                            </select>
                        </div>

                        <div class="col-6 col-md-2 d-flex gap-1">
                            <button type="submit" class="btn btn-primary btn-sm flex-fill" title="Filtrar">
                                <i class="bi bi-funnel me-1"></i>Filtrar
                            </button>
                            <a th:href="@{/dashboard/providers}" class="btn btn-outline-secondary btn-sm" title="Limpiar">
                                <i class="bi bi-x-lg"></i>
                            </a>
                        </div>
                    </form>
                </div>

                <!-- Tabla de Proveedores -->
                <div class="card border-0 shadow-sm overflow-hidden">
                    <div class="table-responsive">
                        <table class="table table-custom align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Razón Social</th>
                                    <th>CUIT / RUT</th>
                                    <th>Correo Electrónico</th>
                                    <th>WhatsApp / Teléfono</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Iteración dinámica si existen proveedores -->
                                <tr th:each="provider : ${providers}" th:if="${providers != null and !providers.isEmpty()}">
                                    <td class="fw-bold text-dark" th:text="${provider.name}">Distribuidora Textil S.A.
                                    </td>
                                    <td class="text-muted" th:text="${provider.cuit}">30-71123456-8</td>
                                    <td th:text="${provider.email}">ventas@textilsa.com</td>
                                    <td>
                                        <a th:href="'https://wa.me/' + ${provider.phone}" target="_blank"
                                            class="text-success text-decoration-none">
                                            <i class="bi bi-whatsapp me-1"></i><span th:text="${provider.phone}">+54 9
                                                11 4444-1234</span>
                                        </a>
                                    </td>
                                    <td class="text-end">
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{/dashboard/providers/{id}(id=${provider.id})}"
                                                class="btn btn-icon btn-outline-secondary" title="Editar"><i
                                                    class="bi bi-pencil"></i></a>
                                            <form method="post"
                                                th:action="@{/dashboard/providers/{id}(id=${provider.id})}"
                                                class="d-inline">
                                                <input type="hidden" th:name="${_csrf.parameterName}"
                                                    th:value="${_csrf.token}">
                                                <input type="hidden" name="_method" value="DELETE">
                                                <button type="submit" class="btn btn-icon btn-outline-danger" title="Eliminar"
                                                    onclick="return confirm('¿Eliminar este proveedor?')"><i
                                                        class="bi bi-trash"></i></button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>

                                <!-- Estado Vacío -->
                                <tr th:if="${providers == null or providers.isEmpty()}">
                                    <td colspan="5" class="text-center py-4 text-muted">
                                        <i class="bi bi-inbox fs-2 d-block mb-1"></i>
                                        No hay proveedores registrados aún.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Paginación Reutilizable -->
                <div th:replace="~{common/fragments/pagination :: paginationBar(${pageResult})}"></div>
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
