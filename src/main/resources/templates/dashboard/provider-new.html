<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Proveedor - Zero Shop Staff</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/styles/styles.css}" href="/styles/styles.css">
</head>
<body class="bg-light">

    <!-- Topbar -->
    <div th:replace="~{common/fragments/dashboard-nav :: dashboard-topbar}"></div>

    <!-- Offcanvas Móvil -->
    <div th:replace="~{common/fragments/dashboard-nav :: dashboard-offcanvas('providers')}"></div>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Desktop -->
            <div class="col-md-3 col-lg-2 d-none d-md-block p-0">
                <div th:replace="~{common/fragments/dashboard-nav :: dashboard-sidebar('providers')}"></div>
            </div>

            <!-- Contenido Principal -->
            <main class="col-12 col-md-9 col-lg-10 p-4">
                <!-- Migas de pan y Título -->
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h4 fw-bold text-dark mb-0">Nuevo Proveedor</h1>
                        <p class="text-muted small mb-0">Registra una nueva empresa proveedora de indumentaria y calzado</p>
                    </div>
                    <a th:href="@{/dashboard/providers}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i>Volver a Proveedores
                    </a>
                </div>

                <div class="row justify-content-center">
                    <div class="col-12 col-lg-8">
                        <div class="card border-0 shadow-sm p-4">
                            <form method="post" th:action="@{/dashboard/providers}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                                <div class="row g-3 mb-3">
                                    <div class="col-sm-7">
                                        <label for="name" class="form-label">Razón Social / Nombre Comercial</label>
                                        <input type="text" id="name" name="name" class="form-control" placeholder="Ej: Distribuidora Textil S.A." required>
                                    </div>
                                    <div class="col-sm-5">
                                        <label for="cuit" class="form-label">CUIT / RUT</label>
                                        <input type="text" id="cuit" name="cuit" class="form-control" placeholder="30-71123456-8" required>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-sm-6">
                                        <label for="email" class="form-label">Correo Electrónico</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                                            <input type="email" id="email" name="email" class="form-control" placeholder="ventas@proveedor.com" required>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <label for="phone" class="form-label">Teléfono / WhatsApp</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white"><i class="bi bi-telephone"></i></span>
                                            <input type="text" id="phone" name="phone" class="form-control" placeholder="+54 11 5555-8888">
                                        </div>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="address" class="form-label">Dirección Fiscal / Depósito Central</label>
                                    <input type="text" id="address" name="address" class="form-control" placeholder="Parque Industrial Pilar, Lote 12">
                                </div>

                                <div class="mb-4">
                                    <label for="contactPerson" class="form-label">Persona de Contacto / Asesor Comercial</label>
                                    <input type="text" id="contactPerson" name="contactPerson" class="form-control" placeholder="Nombre y Apellido del ejecutivo de cuenta">
                                </div>

                                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                    <a th:href="@{/dashboard/providers}" class="btn btn-outline-secondary">Cancelar</a>
                                    <button type="submit" class="btn btn-primary px-4">
                                        <i class="bi bi-plus-lg me-1"></i>Crear Proveedor
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
