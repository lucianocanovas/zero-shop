<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - Zero Shop</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Header Fragment -->
    <div th:replace="~{common/fragments/header :: header}"></div>

    <main class="container my-auto py-5 text-center flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="card border-0 shadow-sm p-4 p-md-5 bg-white">
                    <div class="display-1 fw-bold text-muted mb-2">
                        <span th:text="${status != null ? status : '404'}">404</span>
                    </div>

                    <h1 class="h3 fw-bold text-dark mb-2">¡Ups! Página no encontrada</h1>
                    <p class="text-muted small mb-4">
                        La página que estás buscando puede haber cambiado de dirección, haber sido eliminada o no estar disponible en este momento.
                    </p>

                    <div class="d-flex justify-content-center flex-wrap gap-2">
                        <a th:href="@{/}" class="btn btn-primary fw-semibold px-4 py-2">
                            <i class="bi bi-house-door me-1"></i>Volver al Inicio
                        </a>
                        <a th:href="@{/products}" class="btn btn-outline-dark fw-semibold px-4 py-2">
                            <i class="bi bi-bag me-1"></i>Ver Catálogo
                        </a>
                        <a th:href="@{/contact}" class="btn btn-outline-secondary fw-semibold px-4 py-2">
                            <i class="bi bi-envelope me-1"></i>Contactar Soporte
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{common/fragments/footer :: footer}"></div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
