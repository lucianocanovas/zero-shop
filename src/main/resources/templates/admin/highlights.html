<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destacados | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
        <div class="container-fluid">
            <span class="navbar-brand">Zero Shop Admin</span>
            <div class="ms-auto d-flex gap-2">
                <a class="btn btn-light btn-sm" th:href="@{/admin/dashboard}">Dashboard</a>
                <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Cerrar sesión</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <h1>Elementos destacados del inicio</h1>
        <p class="text-muted">Administración de productos y banners para destacar en la vista de clientes.</p>

        <div class="row g-3">
            <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Producto destacado 1</h5>
                        <p class="card-text">Remera Running Elite</p>
                        <button class="btn btn-primary btn-sm">Editar</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Producto destacado 2</h5>
                        <p class="card-text">Zapatillas Trail Pro</p>
                        <button class="btn btn-primary btn-sm">Editar</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Producto destacado 3</h5>
                        <p class="card-text">Mochila Urban</p>
                        <button class="btn btn-primary btn-sm">Editar</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
