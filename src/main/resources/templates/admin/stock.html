<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
        <div class="container-fluid">
            <span class="navbar-brand">Zero Shop Admin</span>
            <div class="ms-auto d-flex gap-2">
                <a class="btn btn-light btn-sm" th:href="@{/admin/dashboard}">Dashboard</a>
                <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Cerrar sesión</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <h1>Stock</h1>
        <p class="text-muted">Control del inventario disponible por producto.</p>

        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>Producto</th>
                        <th>Categoria</th>
                        <th>Disponible</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Remera Running</td>
                        <td>Indumentaria</td>
                        <td>18</td>
                        <td><span class="badge bg-success">Normal</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
