# Spring Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/zero-shop?currentSchema=public
spring.datasource.username=postgres
spring.datasource.password=root

# Spring JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Spring Application
spring.application.name=zeroshop
spring.mvc.hiddenmethod.filter.enabled=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# Spring Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# DevTools / live reload para HTML, CSS y JS
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/resources/templates,src/main/resources/static
spring.thymeleaf.cache=false
# Inicializador seguro para cargar variables de entorno desde .env
context.initializer.classes=ingsoftware.zeroshop.config.DotEnvInitializer

# Mercado Pago SDK Configuration (Las credenciales se leen exclusivamente desde .env)
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:}
mercadopago.sandbox.enabled=true
app.base-url=${APP_BASE_URL:http://localhost:8080}

logging.file.name=spring.log
