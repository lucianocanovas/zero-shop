# Puerto del servidor
server.port=${PORT:8080}

# Spring Datasource (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zero-shop}?currentSchema=public}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}

# Spring JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=true
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Spring MVC
spring.mvc.hiddenmethod.filter.enabled=true

# Spring Application
spring.application.name=zeroshop
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# Spring Mail
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# DevTools / Live reload
spring.devtools.restart.enabled=${DEVTOOLS_RESTART:false}
spring.devtools.livereload.enabled=${DEVTOOLS_LIVERELOAD:false}
spring.devtools.restart.additional-paths=src/main/resources/templates,src/main/resources/static
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Inicializador seguro para cargar variables de entorno desde .env
context.initializer.classes=ingsoftware.zeroshop.config.DotEnvInitializer

# Mercado Pago SDK Configuration
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:}
mercadopago.sandbox.enabled=${MERCADOPAGO_SANDBOX_ENABLED:true}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${APP_UPLOAD_DIR:uploads/products}

logging.file.name=${LOGGING_FILE_NAME:spring.log}

