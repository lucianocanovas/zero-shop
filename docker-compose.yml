services:
  database:
    image: postgres:16-alpine
    container_name: db_produccion
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-zero-shop}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  app:
    build: .
    container_name: backend_produccion
    restart: always
    ports:
      - "${HTTP_PORT:-80}:8080"
    environment:
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-zero-shop}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN:-}
      - MERCADOPAGO_PUBLIC_KEY=${MERCADOPAGO_PUBLIC_KEY:-}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - app_uploads:/app/uploads
    networks:
      - app-network

volumes:
  postgres_data:
    name: produccion_postgres_data
  app_uploads:
    name: produccion_app_uploads

networks:
  app-network:
    driver: bridge
